spring:
  application:
    name: GEDS

  datasource:
    url: jdbc:postgresql://localhost:5432/geds_db
    username: geds_user
    password: geds_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      indent-output: true
    time-zone: UTC

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# FIX 21: JWT config externalized from JwtUtil hardcoded constant
# Secret must be at least 32 characters for HS256
jwt:
  secret: "change-this-to-a-strong-random-secret-in-production"
  expiration-ms: 3600000  # 1 hour in milliseconds
